[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpfb-mcp"
version = "0.1.0"
description = "MCP server exposing MPFB (MakeHuman Plugin For Blender) tools"
requires-python = ">=3.10"
# Stated as a classifier rather than a PEP 639 SPDX string: that form needs
# setuptools 77+, and the build requirement below admits 68. The licence text
# is in LICENSE, and test modules carry SPDX headers.
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    # Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer and changed
    # other APIs this code is written against.
    "mcp[cli]>=1.2.0,<2",
]

[project.scripts]
mpfb-mcp = "mpfbmcp:main"

[tool.setuptools.packages.find]
where = ["src"]
# Kept after FR 033 deleted the directories that made it necessary, and kept on
# purpose rather than by inertia. Every package under src/ has an __init__.py
# and is meant to; with namespace discovery on, any directory that appears
# there - a stray one, a build artefact, a __pycache__ under an odd layout -
# becomes a shippable package of this distribution without anybody saying so.
# What ships should be a decision, and this is the line that makes it one.
#
# There is no [tool.setuptools.package-data] section any more, which is the
# visible half of the same change: this package shipped ordinary .py files that
# were read and sent to Blender rather than imported, and nothing here is data
# now. Everything under src/ is a module.
namespaces = false
