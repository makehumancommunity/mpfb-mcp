schema_version = "1.0.0"

id = "mpfb_bridge"
version = "0.2.0"
name = "MPFB Bridge"
tagline = "Local command server exposing MPFB to MCP clients"
maintainer = "Joel Palmius"
type = "add-on"
website = "https://github.com/makehumancommunity/mpfb-mcp"

# Higher than MPFB's own floor of 4.2.0, deliberately. It is true that there is
# no point supporting a Blender that cannot run MPFB - but the converse does not
# follow, and this add-on need not inherit MPFB's compatibility obligations.
# MPFB is a general-purpose add-on with an installed base on older Blenders;
# this is a companion whose entire audience installs it on purpose to drive MPFB
# from an agent, and supporting Blenders none of them run costs testing surface
# on every command and buys nothing. It also settles one question outright:
# bpy.utils.register_cli_command, which the headless drive mechanism needs, is
# unambiguously present here and would have needed a guard at 4.2.
blender_version_min = "5.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["Development"]

[permissions]
# The server listens on 127.0.0.1 and is off until started from the preferences
# panel. The wording follows blender lab's MCP add-on, which passed extension
# review with a listening socket declared this way.
network = "Runs a local TCP socket server for MCP client communication"
